<!doctype html>
<!-- DDS portal v5.1 premium-polish 20260628 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Studio · Davis Digital Studio</title>
<meta name="description" content="Your space with Davis Digital Studio. Your project, your progress, and what's next, all in one place.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..480&family=Inter:wght@400;450;500;550;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DAVIS DIGITAL STUDIO — CLIENT PORTAL v5
   One portal, two worlds. The portal reads where the client is in their
   lifecycle and shows the home that fits:
     • PROJECT world  — mid-build. Stage tracker, what's needed, files, billing.
     • PARTNERSHIP world — post-launch retainer. This month, progress, website,
       requests.
   Brand: aubergine + brass on warm paper. Fraunces / Inter / Geist Mono.
   ============================================================================ */
:root{
  --ink:#1B1525; --paper:#FBFAF7; --paper-2:#F4F0E9;
  --p:#5B3FA0; --p-deep:#2A1B4A; --p-mist:#EDE8F7;
  --brass:#B08D57; --brass-deep:#8A6B3C;
  --muted:#6B6276; --hair:#E7E1D6;
  --ok:#3F7D5B; --ok-mist:#E6F0E9;
  --warn:#B5781D; --warn-mist:#F7EEDD;
  --stop:#A8443A; --stop-mist:#F6E5E2;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 30px rgba(27,21,37,.06);
  --shadow-lift:0 2px 6px rgba(27,21,37,.06),0 18px 50px rgba(27,21,37,.10);
  --r:16px; --r-s:11px; --r-pill:100px; --wrap:1000px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
a{color:inherit}
::selection{background:var(--p-mist)}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hide{display:none !important}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}

/* eyebrow */
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-deep);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--brass);display:inline-block}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.86);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--hair)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand b{color:var(--p);font-weight:500}
.who{display:flex;align-items:center;gap:12px}
.who-name{font-size:13.5px;font-weight:500;color:var(--ink)}
.who-sub{font-size:11px;color:var(--muted)}
.signout{font-size:12.5px;color:var(--muted);padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--hair);background:#fff;transition:.14s}
.signout:hover{color:var(--ink);border-color:var(--p);background:var(--p-mist)}

/* ── primary nav (tab bar) ── */
.nav{position:sticky;top:62px;z-index:40;background:var(--paper);border-bottom:1px solid var(--hair)}
.nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.navtab{position:relative;flex:none;padding:14px 16px 13px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.14s;border-bottom:2px solid transparent}
.navtab:hover{color:var(--ink)}
.navtab.on{color:var(--p);border-bottom-color:var(--p)}
.navtab .dot{width:7px;height:7px;border-radius:50%;background:var(--stop);flex:none;box-shadow:0 0 0 3px var(--stop-mist)}
.navtab .badge{font-family:var(--mono);font-size:10.5px;font-weight:500;background:var(--p);color:#fff;border-radius:var(--r-pill);min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* ── layout ── */
main{padding:30px 0 96px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.grid-2{grid-template-columns:1fr}}

/* ── card ── */
.card{background:#fff;border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:24px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.card-title{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em}
.card-sub{font-size:13px;color:var(--muted);margin-top:3px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--hair);background:#fff}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-p{color:var(--p);background:var(--p-mist);border-color:transparent}
.chip-ok{color:var(--ok);background:var(--ok-mist);border-color:transparent}
.chip-warn{color:var(--warn);background:var(--warn-mist);border-color:transparent}
.chip-stop{color:var(--stop);background:var(--stop-mist);border-color:transparent}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:550;padding:11px 18px;border-radius:var(--r-pill);transition:.15s;white-space:nowrap}
.btn-p{background:var(--p);color:#fff;box-shadow:0 1px 2px rgba(91,63,160,.25)}
.btn-p:hover{background:var(--p-deep)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--hair)}
.btn-ghost:hover{border-color:var(--p);color:var(--p);background:var(--p-mist)}
.btn-sm{padding:8px 14px;font-size:12.5px}

/* ── PROJECT: stage tracker ── */
.tracker{display:flex;align-items:stretch;gap:0;margin:8px 0 4px;overflow-x:auto;scrollbar-width:none}
.tracker::-webkit-scrollbar{display:none}
.stage{flex:1;min-width:84px;text-align:center;position:relative;padding-top:26px}
.stage::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--hair)}
.stage:first-child::before{left:50%}
.stage:last-child::before{right:50%}
.stage .pip{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--hair);z-index:2}
.stage.done .pip{background:var(--p);border-color:var(--p)}
.stage.done::before{background:var(--p)}
.stage.now .pip{background:#fff;border-color:var(--p);box-shadow:0 0 0 4px var(--p-mist)}
.stage.now::before{background:linear-gradient(90deg,var(--p) 50%,var(--hair) 50%)}
.stage-lbl{font-size:11.5px;font-weight:500;color:var(--muted);padding:0 4px}
.stage.done .stage-lbl,.stage.now .stage-lbl{color:var(--ink)}
.stage.now .stage-lbl{color:var(--p);font-weight:600}

/* ball in court banner */
.bic{border-radius:var(--r-s);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-top:18px}
.bic-you{background:var(--warn-mist);border:1px solid #ECD9B0}
.bic-us{background:var(--ok-mist);border:1px solid #C9E2D2}
.bic-ico{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px}
.bic-you .bic-ico{background:#fff;color:var(--warn)}
.bic-us .bic-ico{background:#fff;color:var(--ok)}
.bic-t{font-weight:600;font-size:14.5px}
.bic-d{font-size:13px;color:var(--muted);margin-top:3px}

/* spine / feed */
.spine{position:relative;padding-left:26px}
.spine::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:var(--hair)}
.feed-item{position:relative;padding:0 0 18px}
.feed-item:last-child{padding-bottom:0}
.feed-item::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--p-mist);border:2px solid var(--p)}
.feed-t{font-size:14px;font-weight:500}
.feed-d{font-size:12.5px;color:var(--muted);margin-top:2px}
.feed-when{font-family:var(--mono);font-size:10.5px;color:var(--brass-deep);letter-spacing:.03em}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--paper-2);border-radius:var(--r-s);padding:16px;border:1px solid transparent;transition:.15s}
.tile-lead{background:var(--p-mist);border-color:#DFD3F0}
.tile-n{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tile-lead .tile-n{color:var(--p-deep)}
.tile-l{font-size:12px;color:var(--muted);margin-top:6px}
.tile-d{font-size:11px;font-weight:500;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--muted)} .flat{color:var(--muted)}

/* hero band — a light, tight header (not a heavy card) */
.hero-band{padding:6px 2px 2px}

/* list rows */
.lrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--hair)}
.lrow:first-child{border-top:none}
.lrow-ico{width:38px;height:38px;border-radius:10px;background:var(--p-mist);color:var(--p);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.lrow-main{flex:1;min-width:0}
.lrow-t{font-size:14px;font-weight:500}
.lrow-d{font-size:12.5px;color:var(--muted);margin-top:2px}
.lrow-r{flex:none;text-align:right}

/* meter */
.meter{height:8px;border-radius:var(--r-pill);background:var(--paper-2);overflow:hidden}
.meter-f{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--p),var(--brass))}

/* review sections */
.rev-sec{padding:16px 0;border-top:1px solid var(--hair)}
.rev-sec:first-child{border-top:none;padding-top:4px}
.rev-h{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:6px}
.rev-b{font-size:14px;color:#3a3344;line-height:1.65}

/* recommendation card */
.rec{border:1px solid var(--hair);border-radius:var(--r-s);padding:18px;background:#fff}
.rec+.rec{margin-top:12px}
.rec-cat{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-deep)}
.rec-t{font-family:var(--serif);font-size:17px;font-weight:500;margin:6px 0 7px}
.rec-d{font-size:13.5px;color:#3a3344;line-height:1.6}
.rec-why{font-size:12.5px;color:var(--p);margin-top:9px}
.rec-acts{display:flex;gap:9px;margin-top:14px}

/* empty state */
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty-ico{font-size:26px;opacity:.5;margin-bottom:8px}
.empty-t{font-weight:500;color:var(--ink);font-size:14.5px}
.empty-d{font-size:13px;margin-top:5px;max-width:42ch;margin-left:auto;margin-right:auto}

/* ── gate / login ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,var(--p-mist),var(--paper) 60%)}
.gate-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-lift);padding:34px 30px}
.gate-brand{font-family:var(--serif);font-size:22px;font-weight:500;text-align:center}
.gate-brand b{color:var(--p);font-weight:500}
.gate-welcome{text-align:center;color:var(--muted);font-size:13.5px;margin:8px 0 24px}
.fl{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin:0 0 6px}
.fi{width:100%;padding:12px 14px;border:1px solid var(--hair);border-radius:var(--r-s);background:var(--paper);font-size:14px;transition:.14s;margin-bottom:14px}
.fi:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 3px var(--p-mist)}
.gate-msg{font-size:12.5px;text-align:center;min-height:18px;margin-top:4px}
.gate-foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.gate-foot a{color:var(--p);text-decoration:none}
.link{background:none;border:none;color:var(--p);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--paper-2) 25%,#efeae1 50%,var(--paper-2) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(27,21,37,.42);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:620px){.modal-bg{align-items:center;padding:24px}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;box-shadow:var(--shadow-lift);max-height:90vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:var(--r)}}
.modal-pad{padding:26px}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:var(--r-pill);box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* bottom nav (mobile) */
.botnav{display:none}
@media(max-width:760px){
  .nav{display:none}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(251,250,247,.94);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding:6px 0 env(safe-area-inset-bottom)}
  .botnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10px;font-weight:500}
  .botnav button.on{color:var(--p)}
  .botnav .bi{font-size:18px;line-height:1}
  .botnav .bdot{position:absolute;top:4px;margin-left:16px;width:7px;height:7px;border-radius:50%;background:var(--stop)}
}
</style>
</head>
<body>

<!-- ══ LOGIN GATE ══ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-brand">Davis<b>Digital</b> Studio</div>
    <div class="gate-welcome">Welcome back. Sign in to your space.</div>
    <form id="loginForm" autocomplete="on">

      <div class="gate-msg muted" id="gateMsg"></div>

      <button class="link" id="forgotLink" type="button">Forgot your password?</button>

  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="hide">
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#" onclick="return false">Davis<b>Digital</b> Studio</a>
      <div class="who">
        <div class="col" style="align-items:flex-end;gap:1px">
          <span class="who-name" id="whoName">—</span>
          <span class="who-sub" id="whoSub"></span>
        </div>
        <button class="signout" id="signOut">Sign out</button>
      </div>
    </div>
  </header>

  <nav class="nav">
    <div class="wrap nav-in" id="navTabs"></div>
  </nav>

  <main>
    <div class="wrap">
      <div id="content" class="stack"></div>
    </div>
  </main>

  <nav class="botnav" id="botnav"></nav>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================================
   CONFIG + CLIENT
   ============================================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://qksstlqzbhesadrrofgn.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo',
  FN: 'https://qksstlqzbhesadrrofgn.supabase.co/functions/v1/clever-api',
};

let sb = null;
try {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
} catch (e) { console.error('Supabase init failed', e); }

/* ── DOM helpers ── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
let TOAST_T;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(TOAST_T); TOAST_T = setTimeout(() => t.classList.remove('show'), 2600); }

/* ── API ── */
async function api(type, payload = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showGate(); throw new Error('no session'); }
  const res = await fetch(CONFIG.FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dds-user-jwt': session.access_token },
    body: JSON.stringify({ type, ...payload }),
  });
  let j = {};
  try { j = await res.json(); } catch (_) {}
  if (j && j.error) { if (res.status === 401) showGate(); throw new Error(j.error); }
  return j;
}

/* ── date helpers ── */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function periodLabel(p) { if (!p || !/^\d{4}-\d{2}$/.test(p)) return p || ''; const [y, m] = p.split('-'); return `${MONTHS_LONG[+m - 1]} ${y}`; }
function shortDate(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function monthYear(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`; }
function relDays(iso) {
  if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return '';
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday';
  if (days < 30) return `${days} days ago`; if (days < 60) return 'last month';
  return `${Math.floor(days / 30)} months ago`;
}

/* ── gate / app ── */
function showGate() { $('#app').classList.add('hide'); $('#gate').classList.remove('hide'); document.body.classList.remove('logged-in'); }
function showApp() { $('#gate').classList.add('hide'); $('#app').classList.remove('hide'); document.body.classList.add('logged-in'); }

/* ============================================================================
   STATE + ROUTER
   STATE.world is 'project' | 'partnership' | 'none', decided at boot.
   ============================================================================ */
const STATE = { world: 'none', tab: null, project: null, ws: null, acting: false };

/* event types from the project delivery feed → human label + icon */
const EVENT_META = {
  'project.stage_advanced': { i:'→', t:'Project moved forward' },
  'project.launched':       { i:'🚀', t:'Your site launched' },
  'message.sent':           { i:'✉', t:'New message from Eric' },
  'approval.requested':     { i:'✓', t:'Something needs your approval' },
  'invoice.sent':           { i:'$', t:'New invoice' },
  'file.shared':            { i:'📎', t:'New file shared' },
};
const STAGES = [
  { k:'kickoff',  l:'Kickoff' },
  { k:'content',  l:'Content' },
  { k:'design',   l:'Design' },
  { k:'build',    l:'Build' },
  { k:'review',   l:'Review' },
  { k:'launch',   l:'Launch' },
  { k:'complete', l:'Live' },
];
const SEGMENT_LABEL = { new_business:'New business', established:'Established', maintenance:'Maintenance', growth:'Growth' };
const HEALTH_CHIP = { green:'chip-ok', yellow:'chip-warn', red:'chip-stop' };

/* nav definitions per world */
const NAV = {
  project: [
    { k:'home',     l:'Home',     i:'◇' },
    { k:'files',    l:'Files',    i:'📎' },
    { k:'billing',  l:'Billing',  i:'$' },
    { k:'messages', l:'Messages', i:'✉' },
  ],
  partnership: [
    { k:'home',     l:'This month', i:'◇' },
    { k:'progress', l:'Progress',   i:'↗' },
    { k:'website',  l:'Website',    i:'◉' },
    { k:'requests', l:'Requests',   i:'✎' },
  ],
};

function go(tab) {
  STATE.tab = tab;
  buildNav();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildNav() {
  const items = NAV[STATE.world] || [];
  const badges = computeBadges();
  const tabs = $('#navTabs'), bot = $('#botnav');
  tabs.innerHTML = ''; bot.innerHTML = '';
  items.forEach(it => {
    const on = STATE.tab === it.k;
    const b = badges[it.k];
    const tab = document.createElement('button');
    tab.className = 'navtab' + (on ? ' on' : '');
    tab.innerHTML = esc(it.l) + (b ? ` <span class="badge">${b}</span>` : (badges._dot && badges._dot[it.k] ? ` <span class="dot"></span>` : ''));
    tab.onclick = () => go(it.k);
    tabs.appendChild(tab);

    const bb = document.createElement('button');
    bb.className = on ? 'on' : '';
    bb.innerHTML = `<span class="bi">${it.i}</span>${esc(it.l)}${(b || (badges._dot && badges._dot[it.k])) ? '<span class="bdot"></span>' : ''}`;
    bb.onclick = () => go(it.k);
    bot.appendChild(bb);
  });
}

/* badges: counts that pull a client back in (things needing them) */
function computeBadges() {
  const out = { _dot: {} };
  if (STATE.world === 'partnership' && STATE.ws) {
    const recs = (STATE.ws.recommendations || []).filter(r => r.status === 'shared').length;
    if (recs) out.website = recs;
    const draftReq = 0; // requests are outbound; no incoming badge
  }
  if (STATE.world === 'project' && STATE.project) {
    if (STATE.project.ball_in_court === 'client') out._dot.home = true;
  }
  return out;
}

/* ============================================================================
   BOOT
   ============================================================================ */
async function boot() {
  if (!sb) { $('#gateMsg').textContent = 'Sign-in is temporarily unavailable. Email Eric.'; return; }
  wireAuth();
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter(); else showGate();
}

function wireAuth() {
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#loginBtn'), msg = $('#gateMsg');
    btn.disabled = true; btn.textContent = 'Signing in…'; msg.textContent = ''; msg.className = 'gate-msg muted';
    try {
      const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
      if (error) { msg.textContent = 'That email or password didn\'t match. Try again.'; msg.className = 'gate-msg'; msg.style.color = 'var(--stop)'; btn.disabled = false; btn.textContent = 'Sign in'; return; }
      enter();
    } catch (_) { msg.textContent = 'Something went wrong. Try again in a moment.'; btn.disabled = false; btn.textContent = 'Sign in'; }
  });
  $('#forgotLink').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email) { toast('Enter your email first, then tap reset.'); return; }
    try { await fetch(CONFIG.FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'reset_password', email }) });
      toast('Check your email for a reset link.'); } catch (_) { toast('Could not send reset. Email Eric.'); }
  });
  $('#signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
}

/* enter: detect the world, then route to the right home */
async function enter() {
  showApp();
  $('#whoName').textContent = 'Loading…';
  $('#content').innerHTML = skeleton();
  let project = null, ws = null;

  // Ask both worlds in parallel. Whichever the client actually has decides home.
  const [pj, gp] = await Promise.allSettled([ api('client_project'), api('gp_workspace') ]);
  if (pj.status === 'fulfilled') project = (pj.value && pj.value.data) || null;
  if (gp.status === 'fulfilled') ws = (gp.value && gp.value.data && gp.value.data.partnership) ? gp.value.data : null;

  STATE.project = project; STATE.ws = ws;

  // Lifecycle rule:
  //  • Active partnership  → partnership world (it supersedes a finished build).
  //  • Else a live project → project world.
  //  • Else nothing yet    → welcome / no-space state.
  const hasPartnership = !!(ws && ws.partnership);
  const hasProject = !!(project && project.project);
  STATE.world = hasPartnership ? 'partnership' : (hasProject ? 'project' : 'none');

  // identity in the top bar
  const name = (project && project.contact && project.contact.name)
    || (ws && ws.partnership && ws.partnership.client_name) || 'Welcome';
  $('#whoName').textContent = name;
  $('#whoSub').textContent = STATE.world === 'partnership' ? 'Growth partner' : (STATE.world === 'project' ? 'Project in progress' : '');

  STATE.tab = (NAV[STATE.world] && NAV[STATE.world][0].k) || null;
  buildNav();
  render();
}

function healthTiles(health) {
  if (!health || !health.length) return '';
  const latest = health[0], prev = health[1] || {};
  const fmt = (n) => (typeof n === 'number' ? n.toLocaleString('en-US') : n);
  const defs = [['calls','Phone calls'],['forms','Enquiries'],['bookings','Bookings'],['visits','Visitors']];
  const present = defs.filter(([k]) => latest[k] != null);
  if (!present.length) return '';
  const tiles = present.map(([k, label], i) => {
    const now = latest[k], was = prev[k];
    let d = '';
    if (was != null && was !== 0) {
      const pct = Math.round(((now - was) / was) * 100);
      if (pct !== 0) {
        const cls = pct > 0 ? 'up' : 'down';
        d = `<div class="tile-d ${cls}">${pct > 0 ? '↑' : '↓'} ${Math.abs(pct)}% vs last month</div>`;
      } else { d = `<div class="tile-d flat">No change</div>`; }
    }
    return `<div class="tile${i === 0 ? ' tile-lead' : ''}"><div class="tile-n">${esc(fmt(now))}</div><div class="tile-l">${esc(label)}</div>${d}</div>`;
  }).join('');
  return `<section class="card card-pad"><div class="card-h"><div><div class="card-title">How your site is doing</div><div class="card-sub">${esc(periodLabel(latest.period))}${prev.period ? `, compared with ${esc(periodLabel(prev.period))}` : ''}</div></div></div><div class="tiles">${tiles}</div></section>`;
}

  </section>` : `<section class="card card-pad"><div class="empty"><div class="empty-ico">◇</div><div class="empty-t">Your first review is coming</div><div class="empty-d">Each month Eric writes up what got done, what it changed for your business, and what's next, in plain English.</div></div></section>`}

  const months = Object.keys(byMonth).sort().reverse();

    : `<section class="card card-pad"><div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Work shows up here as it's done</div><div class="empty-d">Every change, post, and improvement Eric makes becomes a line you can see.</div></div></section>`;

  return `${reviewHtml || `<section class="card card-pad"><div class="empty"><div class="empty-ico">◇</div><div class="empty-t">No review yet</div><div class="empty-d">Your first monthly review will appear here.</div></div></section>`}

function partWebsite() {
  const ws = STATE.ws;
  const s = ws.site_health;
  const recs = (ws.recommendations || []);
  const shared = recs.filter(r => r.status === 'shared');
  const answered = recs.filter(r => r.status === 'accepted' || r.status === 'declined' || r.status === 'done');

  const score = s && typeof s.overall === 'number' ? s.overall : null;
  const scoreColor = score == null ? 'var(--muted)' : (score >= 70 ? 'var(--ok)' : score >= 45 ? 'var(--warn)' : 'var(--stop)');
  const scoreWord = score == null ? '' : (score >= 80 ? 'Excellent' : score >= 70 ? 'Good shape' : score >= 45 ? 'Some work to do' : 'Needs attention');
  const healthCard = s ? `<section class="card card-pad">
    <div class="card-h"><div><div class="card-title">Your website's health</div><div class="card-sub">Checked ${esc(relDays(s.checked_at))}</div></div></div>
    <div class="row" style="gap:22px;flex-wrap:wrap">
      <div style="text-align:center"><div class="serif" style="font-size:40px;font-weight:500;color:${scoreColor};line-height:1">${score == null ? '—' : score}</div><div class="muted" style="font-size:11.5px;margin-top:2px">Overall</div>${scoreWord ? `<div style="font-size:11px;font-weight:600;color:${scoreColor};margin-top:4px">${scoreWord}</div>` : ''}</div>
      <div style="flex:1;min-width:200px">
        ${[['performance','Speed'],['visibility','Found on Google'],['local','Local presence']].filter(([k]) => s[k] != null).map(([k, l]) => `<div style="margin-bottom:10px"><div class="spread" style="margin-bottom:4px"><span style="font-size:12.5px;color:var(--muted)">${esc(l)}</span><span class="mono" style="font-size:12px">${esc(String(s[k]))}</span></div><div class="meter"><div class="meter-f" style="width:${Math.max(3, Math.min(100, s[k]))}%"></div></div></div>`).join('')}
      </div>
    </div>
  </section>` : `<section class="card card-pad"><div class="empty"><div class="empty-ico">◉</div><div class="empty-t">Health check coming soon</div><div class="empty-d">Eric monitors your site's speed, search visibility, and local presence. The first reading lands here.</div></div></section>`;

  const recCard = `<section class="card card-pad">
    <div class="card-h"><div><div class="card-title">Recommended next</div><div class="card-sub">Eric spotted these. Your call.</div></div></div>
    ${shared.length ? shared.map(r => `<div class="rec" data-rec="${esc(r.id)}">
      <div class="rec-cat">${esc(r.category || 'opportunity')}</div>
      <div class="rec-t">${esc(r.title)}</div>
      ${r.detail ? `<div class="rec-d">${esc(r.detail)}</div>` : ''}
      ${r.why ? `<div class="rec-why">Why it matters: ${esc(r.why)}</div>` : ''}
      <div class="rec-acts"><button class="btn btn-p btn-sm" onclick="respondRec('${esc(r.id)}','accept',this)">Yes, let's do it</button><button class="btn btn-ghost btn-sm" onclick="respondRec('${esc(r.id)}','decline',this)">Not now</button></div>
    </div>`).join('')
      : `<div class="empty"><div class="empty-ico">✦</div><div class="empty-t">Nothing needs a decision</div><div class="empty-d">When Eric finds something worth doing, it shows up here for your yes or no.</div></div>`}
    ${answered.length ? `<div style="margin-top:16px;border-top:1px solid var(--hair);padding-top:14px"><div class="mono muted" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">Already decided</div>${answered.map(r => `<div class="lrow"><div class="lrow-ico" style="background:${r.status === 'declined' ? 'var(--paper-2)' : 'var(--ok-mist)'};color:${r.status === 'declined' ? 'var(--muted)' : 'var(--ok)'}">${r.status === 'declined' ? '–' : '✓'}</div><div class="lrow-main"><div class="lrow-t">${esc(r.title)}</div><div class="lrow-d">${r.status === 'declined' ? 'Not now' : r.status === 'done' ? 'Done' : 'Approved'}</div></div></div>`).join('')}</div>` : ''}
  </section>`;

  return healthCard + recCard;
}

function partRequests() {
  const reqs = STATE.ws.requests || [];
  const STATUS_CHIP = { new:'', 'in_progress':'chip-warn', in_progress:'chip-warn', done:'chip-ok', completed:'chip-ok' };
  return `<section class="card card-pad">
    <div class="card-h"><div><div class="card-title">Ask for something</div><div class="card-sub">Need a change, a new page, or just have a question? Send it here.</div></div><button class="btn btn-p btn-sm" onclick="openRequest()">New request</button></div>
    ${reqs.length ? reqs.map(r => `<div class="lrow"><div class="lrow-ico">✎</div><div class="lrow-main"><div class="lrow-t">${esc(r.title)}</div>${r.detail ? `<div class="lrow-d">${esc(r.detail)}</div>` : ''}<div class="lrow-d">Sent ${esc(relDays(r.created_at))}</div></div><div class="lrow-r"><span class="chip ${STATUS_CHIP[r.status] || ''}" style="font-size:11px">${esc((r.status || 'new').replace('_', ' '))}</span></div></div>`).join('')
      : `<div class="empty"><div class="empty-ico">✎</div><div class="empty-t">No requests yet</div><div class="empty-d">Anything you need, big or small, send it and Eric will pick it up. You'll see its status right here.</div></div>`}
  </section>`;
}

/* request modal */
function openRequest() {
  const m = document.createElement('div');
  m.className = 'modal-bg'; m.id = 'reqModal';
  m.innerHTML = `<div class="modal"><div class="modal-pad">
    <div class="card-title serif" style="margin-bottom:4px">Send a request</div>
    <p class="muted" style="font-size:13px;margin:0 0 18px">Tell Eric what you need. Be as quick or detailed as you like.</p>
    <label class="fl">What do you need?</label>
    <input class="fi" id="rqTitle" placeholder="e.g. Update our hours for the holidays" maxlength="200">
    <label class="fl">Any details? (optional)</label>
    <textarea class="fi" id="rqDetail" rows="4" placeholder="The more you tell me, the faster I can do it." maxlength="4000"></textarea>
    <div class="row" style="justify-content:flex-end;gap:10px;margin-top:6px">
      <button class="btn btn-ghost btn-sm" id="rqCancel">Cancel</button>
      <button class="btn btn-p btn-sm" id="rqSend">Send it</button>
    </div>
  </div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  $('#rqCancel').onclick = () => m.remove();
  $('#rqSend').onclick = sendRequest;
  setTimeout(() => $('#rqTitle').focus(), 50);
}
function wireRequest() { /* button uses inline onclick=openRequest */ }

async function sendRequest() {
  const title = $('#rqTitle').value.trim();
  const detail = $('#rqDetail').value.trim();
  if (!title) { toast('Add a quick line about what you need.'); return; }
  const btn = $('#rqSend'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await api('gp_submit_request', { title, detail });
    $('#reqModal').remove();
    toast('Sent. Eric will pick it up.');
    const r = await api('gp_workspace'); if (r && r.data && r.data.partnership) { STATE.ws = r.data; render(); }
  } catch (e) { btn.disabled = false; btn.textContent = 'Send it'; toast('Could not send. Try again or email Eric.'); }
}

async function respondRec(id, decision, btnEl) {
  if (STATE.acting) return; STATE.acting = true;
  const card = btnEl.closest('.rec');
  $$('.rec-acts button', card).forEach(b => b.disabled = true);
  btnEl.textContent = decision === 'accept' ? 'Saving…' : 'Saving…';
  try {
    await api('gp_rec_respond', { id, decision });
    toast(decision === 'accept' ? 'Great, Eric will get on it.' : 'No problem, noted.');
    const r = await api('gp_workspace'); if (r && r.data && r.data.partnership) { STATE.ws = r.data; buildNav(); render(); }
  } catch (e) {
    toast('Could not save. Try again.');
    $$('.rec-acts button', card).forEach(b => b.disabled = false);
  } finally { STATE.acting = false; }
}

/* go */
boot();
</script>
</body>
</html>
